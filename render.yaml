# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the FastAPI backend, which also serves the built React frontend
# (single service, no CORS/cross-origin cookies to worry about).
#
# One-time setup after connecting this repo in the Render dashboard:
#   1. Set the ANTHROPIC_API_KEY secret (Render will prompt for it - marked
#      `sync: false` below so it's never committed to git).
#   2. Set the UPLOAD_ROLE_PASSWORD secret to whatever password you want to
#      share with teammates who need to upload/edit (editor/steward/admin
#      roles). Leaving it unset means ANYONE with the link can trigger
#      billed Claude API calls - the app logs a startup warning if so.
#
# Free tier (current setting): no persistent disk, so the SQLite database
# resets on every restart/redeploy, and the service spins down after 15
# minutes idle - the next request then takes ~30-50s to wake it back up.
# Both are fine for a test/demo link. To upgrade to a durable deployment
# later: change `plan: free` to `plan: starter`, and add back a `disk:`
# block (mountPath e.g. /var/data) plus a DATABASE_PATH env var pointing
# into it, so the database survives restarts.

services:
  - type: web
    name: financial-statement-governance-demo
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: UPLOAD_ROLE_PASSWORD
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
